# Dataset config for the 2-task model (detection + lane). Used from Step 7 on.
# Folder layout expected under `path` (the converter in Step 5 produces this):
#   images/train/*.jpg                    images/val/*.jpg
#   detection-object/labels/train/*.txt   detection-object/labels/val/*.txt   (YOLO boxes, class 0-16)
#   seg-lane/labels/train/*.txt           seg-lane/labels/val/*.txt           (YOLO polygons, 17 solid / 18 dashed)

path: D:/datasets/lanedet  # dataset root - change to yours (forward slashes on Windows)
train: images/train
val: images/val
test: images/test

# Tasks, in the same order as the heads at the end of the model yaml
labels_list:
  - detection-object
  - seg-lane

tnc: 19  # total names below
nc_list: [17, 2]  # detection classes, lane classes (solid, dashed)
map: [None, {'17': '0', '18': '1'}]  # lane polygons use classes 17/18; the lane head sees them as 0/1

names:
  # detection (0-16)
  0: speed_10
  1: speed_15
  2: speed_30
  3: speed_60
  4: speed_80
  5: light_red
  6: light_amber
  7: light_green
  8: cone
  9: pedestrian
  10: car  # includes buses and trucks
  11: bicycle
  12: two_wheeler
  13: cow
  14: steel_barricade
  15: speed_breaker
  16: cardboard_box
  # lane segmentation
  17: lane_solid
  18: lane_dashed
